services:
  - type: web
    name: heeben
    runtime: docker
    plan: starter          # a persistent disk needs a paid plan; free plans lose the database on restart
    healthCheckPath: /
    envVars:
      - key: HEEBEN_DEMO
        value: "0"
      - key: HEEBEN_DB
        value: /data/heeben.db
    disk:
      name: heeben-data
      mountPath: /data
      sizeGB: 1
